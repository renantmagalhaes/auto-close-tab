<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Auto Close Tab</title>
    <link rel="stylesheet" href="../styles/styles.css" />
  </head>
  <body class="popup-page">
    <div class="popup-container">
      <!-- Header -->
      <div class="header">
        <h1>⏱️ Auto Close Tab</h1>
        <div class="header-actions">
          <div style="display: flex; align-items: center; gap: 8px; margin-right: 12px; padding-right: 12px; border-right: 1px solid var(--border-color);">
            <span id="statusMessage" style="font-size: 11px; font-weight: 700; color: var(--text-secondary);">Active</span>
            <label class="switch">
              <input type="checkbox" id="extensionEnabled" checked>
              <span class="slider round"></span>
            </label>
          </div>
          <button class="icon-button" id="themeToggle" title="Toggle theme">🌙</button>
          <button class="icon-button" id="openSettings" title="Settings">⚙️</button>
        </div>
      </div>

      <!-- Tabs List Section -->
      <div class="results-section tabs-section">
        <h2 class="section-label">Open Tabs (Click to Auto-Close)</h2>
        <div class="results-list" id="tabsList">
          <div class="state-box">
            <span class="state-icon">🔄</span>
            <p>Loading open tabs...</p>
          </div>
        </div>
      </div>

      <!-- Active Rules Summary -->
      <div class="summary-section rules-section">
        <div class="summary-content">
          <span class="section-label">Auto-Close Rules</span>
          <div class="summary-data">
            <span id="rulesCount">0 Active</span>
            <a href="#" class="manage-link" id="manageRules">Manage ⚙️</a>
          </div>
        </div>
      </div>

      <!-- Instance Limits Summary -->
      <div class="summary-section limits-section">
        <div class="summary-content">
          <span class="section-label">Instance Limits</span>
          <div class="summary-data">
            <span id="limitsCount">0 Active</span>
            <a href="#" class="manage-link" id="manageLimits">Manage ⚙️</a>
          </div>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
